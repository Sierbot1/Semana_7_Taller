$kind: http-request
description: "Faltan code y stock. Responde: El codigo del equipo es obligatorio, El stock es obligatorio"
url: "{{baseUrl}}/equipment"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Cámara sin código"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 400", function () { pm.response.to.have.status(400); });
      pm.test("Mensaje de error claro", function () { pm.expect(pm.response.json().error).to.be.a("string").and.not.empty; });
    language: text/javascript
order: 1000
