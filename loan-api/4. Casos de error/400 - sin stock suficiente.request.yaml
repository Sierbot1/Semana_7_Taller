$kind: http-request
description: ""
url: "{{baseUrl}}/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": "{{anaId}}",
      "equipmentId": "{{portatilId}}",
      "quantity": 50
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 400", function () { pm.response.to.have.status(400); });
      pm.test("Mensaje de error claro", function () { pm.expect(pm.response.json().error).to.be.a("string").and.not.empty; });
    language: text/javascript
order: 4000
