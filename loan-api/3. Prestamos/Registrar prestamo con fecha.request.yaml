$kind: http-request
description: ""
url: "{{baseUrl}}/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": "{{luisId}}",
      "equipmentId": "{{camaraId}}",
      "quantity": 1,
      "loanDate": "2026-09-19"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("prestamoLuisId", pm.response.json().id);
    language: text/javascript
order: 2000
