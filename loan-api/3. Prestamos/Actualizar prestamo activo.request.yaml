$kind: http-request
description: Devuelve al stock la cantidad anterior y descuenta la nueva (4 -> 3).
url: "{{baseUrl}}/loans/{{prestamoAnaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": "{{anaId}}",
      "equipmentId": "{{portatilId}}",
      "quantity": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.test("El stock queda en 3", function () { pm.expect(pm.response.json().equipment.stock).to.eql(3); });
    language: text/javascript
order: 6000
