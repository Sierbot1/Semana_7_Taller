$kind: http-request
description: Sin cuerpo. Pone return_date y devuelve las unidades al stock (3 -> 6).
url: "{{baseUrl}}/loans/{{prestamoAnaId}}/return"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.test("El stock queda en 6", function () { pm.expect(pm.response.json().equipment.stock).to.eql(6); });
    language: text/javascript
order: 7000
