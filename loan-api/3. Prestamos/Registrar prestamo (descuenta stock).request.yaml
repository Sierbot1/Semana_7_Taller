$kind: http-request
description: "Resta la cantidad al stock del equipo (6 -> 4). loanDate es opcional: si no se envia se usa la fecha de hoy."
url: "{{baseUrl}}/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": "{{anaId}}",
      "equipmentId": "{{portatilId}}",
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("prestamoAnaId", pm.response.json().id);
      pm.test("El stock queda en 4", function () { pm.expect(pm.response.json().equipment.stock).to.eql(4); });
    language: text/javascript
order: 1000
